services:
  - type: web
    name: temple-ai-os-api
    runtime: python
    rootDir: 04_Demo開發/temple-ai-os-app/backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: LINE_SKIP_SIGNATURE_VALIDATION
        value: "false"

